name: "Deploy: Dev"

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Shares testing's Supabase project (sandbox simplification - the real app
  # gives dev its own project). Migrations still run for real on every push,
  # same as testing/production; this just avoids provisioning a second
  # Supabase project for a throwaway sandbox.
  deploy-dev:
    uses: ./.github/workflows/_deploy.yaml
    with:
      environment: development
      vercel-environment: preview
      vercel-production: false
      vercel-project-id: ${{ vars.VERCEL_PROJECT }}
      run-migration: true
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
