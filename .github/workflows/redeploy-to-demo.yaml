name: "Release: Redeploy to Demo"

# Manually re-deploy an EXISTING tag to preview without cutting a new
# release - e.g. after changing a Vercel env var, so the change actually
# takes effect on the running deployment instead of waiting for the next
# hotfix or release.
#
# Mirrors the `redeploy` input already on promote-to-production.yaml, but
# lives in its own dispatch workflow (like promote-to-production.yaml
# itself does) rather than bolted onto the push-triggered
# release-please.yaml - preview serves both regular release tags and
# hotfix tags, not hotfixes alone.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-deploy to preview (e.g. v1.0.1). Must already have a GitHub Release."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Confirm the tag has a release
        uses: actions/github-script@v9
        env:
          INPUT_TAG: ${{ inputs.tag }}
        with:
          script: |
            const { validateTagName } = require('./scripts/ci/check-release-downgrade.js');

            const tag = process.env.INPUT_TAG;

            if (!validateTagName(tag)) {
              core.setFailed(`Tag "${tag}" does not match strict v-prefixed semver (e.g. v1.0.1). Refusing to redeploy.`);
              return;
            }

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
            } catch (err) {
              if (err.status === 404) {
                core.setFailed(`No GitHub Release found for tag "${tag}" - nothing to re-deploy.`);
                return;
              }
              throw err;
            }
            core.info(`${tag} has a release - proceeding to redeploy to preview`);

  deploy-to-demo:
    needs: validate-tag
    uses: ./.github/workflows/_deploy.yaml
    with:
      environment: testing
      vercel-environment: preview
      vercel-production: false
      vercel-project-id: ${{ vars.VERCEL_PROJECT }}
      run-migration: true
      ref: ${{ inputs.tag }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  notify:
    runs-on: ubuntu-latest
    needs: [validate-tag, deploy-to-demo]
    if: |
      always() && (needs.deploy-to-demo.result == 'success' || needs.deploy-to-demo.result == 'failure')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/compose-notification
        id: compose
        with:
          template: demo-deploy
          deploy-result: ${{ needs.deploy-to-demo.result }}
          tag: ${{ inputs.tag }}
          redeploy: true
      - uses: ./.github/actions/discord-notify-outcome
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: ${{ steps.compose.outputs.title }}
          status: ${{ steps.compose.outputs.status }}
          message: ${{ steps.compose.outputs.message }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
