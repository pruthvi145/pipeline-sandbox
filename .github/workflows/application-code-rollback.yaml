name: "Release: Application Code Rollback"

# Pipeline: resolve target + migration gate → (instant Vercel rollback |
# full rebuild fallback) → mark-stable. Never runs alongside a promote or
# another rollback (shares the deploy-production concurrency group with
# promote-to-production.yaml).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact release tag to roll back to (e.g. v1.0.0). Leave blank to auto-resolve to the release before the current live one."
        required: false
        default: ""
        type: string
      db_action:
        description: "Only required when a database migration boundary is crossed. 'proceed' deploys old code against the current, additive-only schema. 'restore' is recognized but NOT implemented - this sandbox is app-code-only rollback."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Resolve the target and run the migration gate check, but do not deploy."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target_tag: ${{ steps.gate-check.outputs.target_tag }}
      resolved_via: ${{ steps.gate-check.outputs.resolved_via }}
      live_tag: ${{ steps.live.outputs.live_tag }}
      migration_boundary: ${{ steps.gate-check.outputs.migration_boundary }}
      gate_status: ${{ steps.gate-check.outputs.gate_status }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Find current live release + all stable releases
        id: live
        uses: actions/github-script@v9
        with:
          script: |
            const { data: latest } = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const all = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const stable = all
              .filter((r) => !r.draft && !r.prerelease)
              .map((r) => ({ tag: r.tag_name, publishedAt: r.published_at }));

            core.setOutput('live_tag', latest.tag_name);
            core.setOutput('releases', JSON.stringify(stable));
            core.info(`Live release: ${latest.tag_name} (${stable.length} stable releases total)`);

      - name: Resolve rollback target tag
        id: resolve-tag
        uses: ./.github/actions/resolve-rollback-target
        with:
          requested-tag: ${{ inputs.tag }}
          live-tag: ${{ steps.live.outputs.live_tag }}
          releases: ${{ steps.live.outputs.releases }}
          changed-files: "[]"

      - name: Diff supabase/migrations between target and live
        id: diff
        env:
          TARGET_TAG: ${{ steps.resolve-tag.outputs.tag }}
          LIVE_TAG: ${{ steps.live.outputs.live_tag }}
        run: |
          set -euo pipefail

          git fetch --depth=1 origin \
            "refs/tags/${TARGET_TAG}:refs/tags/${TARGET_TAG}" \
            "refs/tags/${LIVE_TAG}:refs/tags/${LIVE_TAG}"

          MIGRATION_FILES="$(git diff --name-only "refs/tags/${TARGET_TAG}..refs/tags/${LIVE_TAG}" -- supabase/migrations/)"
          COUNT="$(printf '%s\n' "$MIGRATION_FILES" | grep -c . || true)"

          if [ -n "$MIGRATION_FILES" ]; then
            echo "Migrations crossed between ${TARGET_TAG} and ${LIVE_TAG}:"
            echo "$MIGRATION_FILES"
          else
            echo "No migrations crossed between ${TARGET_TAG} and ${LIVE_TAG}."
          fi

          echo "migrated_files_count=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "migration_boundary=$([ "$COUNT" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Print rollback summary + enforce migration gate
        id: gate-check
        uses: actions/github-script@v9
        env:
          TARGET_TAG: ${{ steps.resolve-tag.outputs.tag }}
          RESOLVED_VIA: ${{ steps.resolve-tag.outputs.resolved-via }}
          LIVE_TAG: ${{ steps.live.outputs.live_tag }}
          MIGRATION_BOUNDARY: ${{ steps.diff.outputs.migration_boundary }}
          MIGRATED_FILES_COUNT: ${{ steps.diff.outputs.migrated_files_count }}
          DB_ACTION: ${{ inputs.db_action }}
        with:
          script: |
            const targetTag = process.env.TARGET_TAG;
            const resolvedVia = process.env.RESOLVED_VIA;
            const liveTag = process.env.LIVE_TAG;
            const boundary = process.env.MIGRATION_BOUNDARY === 'true';
            const migratedCount = process.env.MIGRATED_FILES_COUNT;
            const dbAction = process.env.DB_ACTION;

            const resolvedViaLine = resolvedVia === 'auto'
              ? 'auto (tag input was blank)'
              : 'manual (explicit tag input)';
            const migrationsLine = boundary
              ? `${migratedCount} - confirm_db_boundary required`
              : '0';

            await core.summary
              .addRaw('```', true)
              .addRaw(`Rollback target:      ${targetTag}`, true)
              .addRaw(`Resolved via:         ${resolvedViaLine}`, true)
              .addRaw(`Currently live:       ${liveTag}`, true)
              .addRaw(`Migrations crossed:   ${migrationsLine}`, true)
              .addRaw('```', true)
              .write();

            core.setOutput('target_tag', targetTag);
            core.setOutput('resolved_via', resolvedVia);
            core.setOutput('migration_boundary', String(boundary));

            if (!boundary) {
              core.setOutput('gate_status', 'ok');
              core.info(`No migration boundary between ${targetTag} and ${liveTag} - proceeding.`);
              return;
            }

            if (dbAction === 'proceed') {
              core.setOutput('gate_status', 'ok');
              core.warning(
                `Migration boundary crossed rolling back to ${targetTag} - proceeding because ` +
                `db_action=proceed. This deploys old code against the current, additive-only ` +
                `schema; no database action is taken.`
              );
              return;
            }

            if (dbAction === 'restore') {
              core.setOutput('gate_status', 'blocked-restore');
              core.setFailed(
                "This rollback crosses a database migration and needs a restore, which isn't " +
                "implemented in this sandbox - it's app-code-only rollback. If you're certain the " +
                "migration was additive-only and old code is compatible, re-run with db_action: proceed instead."
              );
              return;
            }

            core.setOutput('gate_status', 'blocked-invalid');
            core.setFailed(
              'A migration boundary was found between the target and the live release. Set ' +
              'db_action to \'proceed\' to continue (only safe for additive-only migrations).'
            );

  find-deployment:
    needs: resolve
    # A job's own `if:` replaces GitHub's default "needs succeeded" check,
    # not adds to it - without needs.resolve.result here, a deliberately
    # failed gate (core.setFailed on an unconfirmed migration boundary)
    # would not stop this job or the deploy jobs after it from running.
    if: needs.resolve.result == 'success' && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployment_id: ${{ steps.find.outputs.deployment_id }}
      found: ${{ steps.find.outputs.found }}
    permissions:
      contents: read
    steps:
      - name: Resolve target tag's commit SHA
        id: sha
        uses: actions/github-script@v9
        env:
          TARGET_TAG: ${{ needs.resolve.outputs.target_tag }}
        with:
          script: |
            const { data } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.TARGET_TAG,
            });
            core.setOutput('sha', data.sha);

      - name: Look up an existing Vercel production deployment for that commit
        id: find
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          COMMIT_SHA: ${{ steps.sha.outputs.sha }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sf --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=${{ vars.VERCEL_PROJECT }}&target=production&state=READY&slug=${{ vars.VERCEL_SCOPE }}&meta-githubCommitSha=${COMMIT_SHA}&limit=1")
          DEPLOYMENT_ID=$(echo "$RESPONSE" | jq -r '.deployments[0].uid // empty')
          if [ -n "$DEPLOYMENT_ID" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
            echo "Found existing Vercel deployment $DEPLOYMENT_ID for commit ${COMMIT_SHA}"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No existing READY production deployment found for commit ${COMMIT_SHA} - will fall back to a full rebuild"
          fi

  deploy-instant-rollback:
    needs: [resolve, find-deployment]
    if: |
      needs.resolve.result == 'success' && needs.find-deployment.result == 'success' &&
      inputs.dry_run != true && needs.find-deployment.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.target_tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          ref: ${{ needs.resolve.outputs.target_tag }}

      - name: Link Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel link --scope=${{ vars.VERCEL_SCOPE }} --project=${{ vars.VERCEL_PROJECT }} --yes --token="$VERCEL_TOKEN"

      - name: Vercel Instant Rollback (re-alias production, no rebuild)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_ID: ${{ needs.find-deployment.outputs.deployment_id }}
        run: npx vercel rollback "$DEPLOYMENT_ID" --scope=${{ vars.VERCEL_SCOPE }} --token="$VERCEL_TOKEN" --yes

      - name: Rollback Summary
        env:
          TARGET_TAG: ${{ needs.resolve.outputs.target_tag }}
          DEPLOYMENT_ID: ${{ needs.find-deployment.outputs.deployment_id }}
        run: |
          {
            echo "## ⏪ Instant Rollback Complete"
            echo ""
            echo "**Target:** $TARGET_TAG"
            echo "**Deployment:** $DEPLOYMENT_ID"
            echo "**Alias:** ${{ vars.PROD_ALIAS }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Only reached when Vercel no longer has a matching prior deployment to
  # instant-rollback to (pruned, or never built with this exact output -
  # e.g. a very old tag). Rebuilds and deploys like a normal promote, but
  # with migrations forced off - the resolve job's gate already established
  # that either no migration boundary exists, or the operator explicitly
  # accepted deploying old code against the current schema.
  deploy-fallback:
    needs: [resolve, find-deployment]
    if: |
      needs.resolve.result == 'success' && needs.find-deployment.result == 'success' &&
      inputs.dry_run != true && needs.find-deployment.outputs.found != 'true'
    uses: ./.github/workflows/_deploy.yaml
    with:
      environment: production
      vercel-environment: production
      vercel-production: true
      vercel-project-id: ${{ vars.VERCEL_PROJECT }}
      run-migration: false
      vercel-alias: ${{ vars.PROD_ALIAS }}
      ref: ${{ needs.resolve.outputs.target_tag }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  # Sandbox simplification: default GITHUB_TOKEN instead of a GitHub App
  # token - see the matching note in promote-to-production.yaml.
  mark-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [resolve, deploy-instant-rollback, deploy-fallback]
    # always(): exactly one of deploy-instant-rollback/deploy-fallback is
    # *designed* to be skipped every single run (they're mutually exclusive
    # paths) - without always(), GitHub's default needs-chain behavior skips
    # this job every time, since it always has at least one skipped need.
    # Confirmed via GitHub's own docs: a skipped job in `needs:` skips every
    # downstream job unless its `if:` starts with always(). This is a real
    # bug in the actual PR #1670 branch too, not sandbox-only.
    if: |
      always() && inputs.dry_run != true &&
      (needs.deploy-instant-rollback.result == 'success' || needs.deploy-fallback.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Mark rollback target as the latest stable release
        uses: actions/github-script@v9
        env:
          TARGET_TAG: ${{ needs.resolve.outputs.target_tag }}
        with:
          script: |
            const tag = process.env.TARGET_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              prerelease: false,
              make_latest: 'true',
            });
            core.info(`${tag} is now the latest stable release`);
