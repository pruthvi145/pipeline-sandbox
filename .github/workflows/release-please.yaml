name: "Release: Create Release PR"

# Handles both main-line releases (push to main) and hotfix releases (push
# to any release/vX.Y.Z branch) in one file - the original locked design for
# this pipeline (totalfamily/app PR #1717), applied here too instead of a
# separate release-please-hotfix.yaml. Hotfix-only jobs
# (verify-current-release-branch, backport-to-main, cleanup-on-failure) skip
# via `if: github.ref_name != 'main'`. mark-prerelease/deploy-to-demo/
# smoke-check are shared unchanged - neither ever referenced hotfix
# specifics, so both push paths already used the same logic.
#
# Sandbox simplification: no GitHub App bot token (uses the workflow's own
# GITHUB_TOKEN), vercel-environment is "preview" not "testing" (Hobby plan),
# no Slack, smoke-check replaces Playwright E2E. Two config files remain
# (release-please-config.json vs .hotfix.json) since versioning-strategy
# genuinely differs and release-please-action takes exactly one config per
# run - only the *workflow* file is unified, not the config.
on:
  push:
    branches: [main, "release/v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # release/vX.Y.Z branches are permanent and never deleted, so once one's
  # been superseded by a newer release it can still receive stray pushes (a
  # mistaken merge, a rebase, etc). Don't let release-please react to those -
  # only the branch matching the current production release may cut a
  # hotfix release. main has no such concept.
  verify-current-release-branch:
    # No `if:` gate here on purpose - a job with conclusion "skipped" breaks
    # output propagation for anything downstream of its consumer, even
    # through a consumer that uses always() to survive the skip itself
    # (confirmed: release-please's own step output release_created='true',
    # but mark-prerelease/deploy-to-demo/notify still read it as not 'true'
    # and skipped, only when this job was conditionally skipped for main).
    # Always running and short-circuiting instantly for main avoids the
    # skip state entirely, which is what actually fixes it - not always().
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_current: ${{ steps.check.outputs.is_current }}
    steps:
      - uses: actions/checkout@v7
        if: github.ref_name != 'main'

      - name: Confirm this is the current production release branch
        id: check
        uses: actions/github-script@v9
        with:
          script: |
            if (context.ref.replace('refs/heads/', '') === 'main') {
              core.setOutput('is_current', 'true');
              return;
            }

            const { expectedReleaseBranch, isCurrentReleaseBranch } = require('./scripts/ci/resolve-release-branch.js');

            const branch = context.ref.replace('refs/heads/', '');

            let latestTag;
            try {
              const { data: latest } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              latestTag = latest.tag_name;
            } catch (err) {
              if (err.status !== 404) throw err;
              core.warning('No stable release found yet - allowing (first release branch ever)');
              core.setOutput('is_current', 'true');
              return;
            }

            const isCurrent = isCurrentReleaseBranch(branch, latestTag);
            if (!isCurrent) {
              core.warning(
                `${branch} is not the current release branch (production is on ${latestTag}, expected ` +
                `branch "${expectedReleaseBranch(latestTag)}"). This branch has been superseded - skipping release-please.`
              );
            }
            core.setOutput('is_current', String(isCurrent));

  # Sandbox: no GitHub App token, uses this workflow's own GITHUB_TOKEN -
  # requires "Allow GitHub Actions to create and approve pull requests" in
  # Settings -> Actions -> General (already turned on for this repo).
  release-please:
    needs: verify-current-release-branch
    if: |
      always() &&
      (github.ref_name == 'main' || needs.verify-current-release-branch.outputs.is_current == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: ${{ github.ref_name == 'main' && 'release-please-config.json' || 'release-please-config.hotfix.json' }}
          manifest-file: .release-please-manifest.json
          # Omit target-branch for main entirely, don't just pass "main" -
          # explicitly passing it (even as the same value the default would
          # resolve to) broke squash-merge release-commit detection: the
          # release PR merged and the tag got cut, but release_created came
          # back false, so mark-prerelease/deploy-to-demo/notify never ran.
          # Confirmed by comparing against this same repo's pre-merge
          # release-please.yaml, which never passed target-branch and never
          # had this problem.
          target-branch: ${{ github.ref_name != 'main' && github.ref_name || '' }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Flip to prerelease BEFORE deploy so a failed deploy never leaves the
  # release as the latest stable. Shared by main and hotfix releases alike.
  mark-prerelease:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    steps:
      - name: Convert release to pre-release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              prerelease: true,
            });
            core.info(`Marked ${tag} as pre-release`);

  # vercel-environment is "preview" here, not "testing" - Vercel's custom
  # named environments require a paid plan, unavailable on this sandbox's
  # Hobby account. Shared by main and hotfix releases alike.
  deploy-to-demo:
    needs: [release-please, mark-prerelease]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/_deploy.yaml
    with:
      environment: testing
      vercel-environment: preview
      vercel-production: false
      vercel-project-id: ${{ vars.VERCEL_PROJECT }}
      run-migration: true
      ref: ${{ needs.release-please.outputs.tag_name }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  # Stand-in for the real app's Playwright E2E suite, which this sandbox
  # doesn't have. Just proves the tag actually deployed and serves traffic.
  # Shared by main and hotfix releases alike.
  smoke-check:
    name: Smoke-check the release on preview
    needs: [release-please, deploy-to-demo]
    if: needs.deploy-to-demo.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/health on the preview deployment
        env:
          DEPLOY_URL: ${{ needs.deploy-to-demo.outputs.deployment-url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          echo "Checking ${DEPLOY_URL}/api/health"
          # Preview deployments sit behind Vercel's SSO wall - without -L and
          # the bypass header, a broken /api/health and a healthy one look
          # identical here: both just redirect to vercel.com/sso-api with a
          # 302, and `curl -f` only fails on 4xx/5xx, so it "passes" either
          # way. -L follows the redirect (a no-op once bypassed) and -f then
          # correctly fails on whatever /api/health actually returns.
          curl -fsSL \
            -H "x-vercel-protection-bypass: ${BYPASS_SECRET}" \
            -H "x-vercel-set-bypass-cookie: true" \
            "${DEPLOY_URL}/api/health"

  # A failed demo deploy or smoke-check on a hotfix deletes the tag+release
  # it just cut and reverts the manifest, so the retry proposes the SAME
  # patch version again instead of skipping ahead - clean version history,
  # no gaps. Main has no equivalent retry path - a failed RC just blocks
  # promotion as-is.
  cleanup-on-failure:
    if: |
      always() &&
      github.ref_name != 'main' &&
      needs.release-please.outputs.release_created == 'true' &&
      (needs.deploy-to-demo.result == 'failure' || needs.smoke-check.result == 'failure')
    needs: [release-please, deploy-to-demo, smoke-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete failed tag + release, revert the manifest
        uses: actions/github-script@v9
        env:
          FAILED_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const { parseVersionTag } = require('./scripts/ci/check-release-downgrade.js');
            const { revertManifestVersion, tagToManifestVersion } = require('./scripts/ci/revert-hotfix-manifest.js');

            const failedTag = process.env.FAILED_TAG;
            const failedVersion = tagToManifestVersion(failedTag);

            const parts = parseVersionTag(failedTag);
            if (!parts) {
              core.setFailed(`Cannot compute the previous version - "${failedTag}" is not a valid vX.Y.Z tag`);
              return;
            }
            const [major, minor, patch] = parts;
            const previousVersion = `${major}.${minor}.${Math.max(patch - 1, 0)}`;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: failedTag,
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              core.info(`Deleted release ${failedTag}`);
            } catch (err) {
              if (err.status !== 404) throw err;
              core.info(`No release found for ${failedTag} - already gone`);
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${failedTag}`,
              });
              core.info(`Deleted tag ${failedTag}`);
            } catch (err) {
              if (err.status !== 404 && err.status !== 422) throw err;
              core.info(`No tag ref found for ${failedTag} - already gone`);
            }

            const manifestPath = '.release-please-manifest.json';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const { manifest: revertedManifest, reverted } = revertManifestVersion(manifest, {
              failedVersion,
              previousVersion,
            });

            if (!reverted) {
              core.warning(
                `.release-please-manifest.json no longer holds "${failedVersion}" - leaving it untouched ` +
                `(something else already changed it)`
              );
              return;
            }

            fs.writeFileSync(manifestPath, JSON.stringify(revertedManifest, null, 2) + '\n');

            await exec.exec('git', ['config', 'user.name', 'github-actions[bot]']);
            await exec.exec('git', ['config', 'user.email', 'github-actions[bot]@users.noreply.github.com']);
            await exec.exec('git', ['add', manifestPath]);
            await exec.exec('git', ['commit', '-m', `chore: revert manifest after failed hotfix ${failedTag}`]);
            await exec.exec('git', ['push', 'origin', `HEAD:${process.env.RELEASE_BRANCH}`]);

            core.info(`Reverted manifest ${failedVersion} -> ${previousVersion} on ${process.env.RELEASE_BRANCH}`);

  backport-to-main:
    name: Open backport PR to main
    if: |
      github.ref_name != 'main' &&
      needs.deploy-to-demo.result == 'success' &&
      needs.smoke-check.result == 'success'
    needs: [release-please, deploy-to-demo, smoke-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Cherry-pick hotfix commits + open backport PR
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          CP_BRANCH="backport/${VERSION}-to-main"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin "${RELEASE_BRANCH}"

          # release/vX.Y.Z branches are permanent and accumulate hotfixes over
          # time, so a plain ancestry range (main..branch) would re-list
          # commits from an earlier hotfix already backported to main under a
          # different cherry-pick SHA. `--cherry-pick --right-only` drops
          # commits already applied to main by patch content, not just by
          # exact SHA. release-please's own release/manifest commit is
          # excluded too - cherry-picking it would overwrite main's version
          # files with the hotfix version.
          COMMITS=$(git log --reverse --no-merges --cherry-pick --right-only \
            --invert-grep --grep='^chore(.*)\?: release' \
            --pretty=format:%H "main...origin/${RELEASE_BRANCH}")
          if [ -z "$COMMITS" ]; then
            echo "No commits on ${RELEASE_BRANCH} beyond main - nothing to backport"
            exit 0
          fi

          git checkout -b "${CP_BRANCH}"

          CONFLICTS=""
          CLEAN_COUNT=0
          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            if git cherry-pick "$sha"; then
              CLEAN_COUNT=$((CLEAN_COUNT + 1))
            else
              CONFLICTS="${CONFLICTS}- \`${sha}\`"$'\n'
              git cherry-pick --abort
            fi
          done <<< "$COMMITS"

          # Fail fast if every commit conflicted. Without this, we'd push an
          # empty branch and `gh pr create` would bail with "no commits
          # between base and head" - obscuring the real failure.
          if [ "$CLEAN_COUNT" -eq 0 ]; then
            echo "::error::All commits conflicted during backport to main. Resolve manually on ${RELEASE_BRANCH}, then re-run."
            exit 1
          fi

          git push origin "${CP_BRANCH}"

          BODY="Auto-generated backport PR for hotfix **${VERSION}** (from \`${RELEASE_BRANCH}\`)."$'\n\n'
          BODY="${BODY}Merge within 24h to prevent drift between main and the hotfix tag."

          PR_FLAGS=(
            --title "chore: backport hotfix ${VERSION} to main"
            --base main
            --head "${CP_BRANCH}"
          )

          if [ -n "$CONFLICTS" ]; then
            # Draft PR so a reviewer must manually resolve conflicts before
            # the backport can merge.
            BODY="${BODY}"$'\n\n'"⚠️ **Conflicts detected - MANUAL RESOLUTION REQUIRED.**"$'\n\n'
            BODY="${BODY}"$'The following commits could not be applied cleanly:\n\n'"${CONFLICTS}"$'\n'
            BODY="${BODY}"$'Check out this branch, apply each conflicted commit manually, resolve, and push.\n'
            PR_FLAGS+=(--draft)
            echo "::warning::Backport had conflicts on $(echo "$CONFLICTS" | grep -c '^-' || true) commits - PR opened as draft"
          fi

          gh pr create --body "$BODY" "${PR_FLAGS[@]}"

  notify-demo:
    name: Notify - main RC deploy
    if: |
      github.ref_name == 'main' && always() &&
      needs.release-please.outputs.release_created == 'true' &&
      needs.deploy-to-demo.result != 'skipped'
    needs: [release-please, deploy-to-demo, smoke-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/compose-notification
        id: compose
        with:
          template: demo-deploy
          deploy-result: ${{ needs.deploy-to-demo.result }}
          secondary-result: ${{ needs.smoke-check.result }}
          tag: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/discord-notify-outcome
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: ${{ steps.compose.outputs.title }}
          status: ${{ steps.compose.outputs.status }}
          message: ${{ steps.compose.outputs.message }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  notify-hotfix:
    name: Notify - hotfix deploy
    if: |
      github.ref_name != 'main' && always() &&
      needs.release-please.outputs.release_created == 'true'
    needs: [release-please, deploy-to-demo, smoke-check, backport-to-main]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pin to main, not the default github.ref (the release branch) - a
      # frozen release branch may predate fixes to compose-notification's
      # hotfix-deploy template.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: ./.github/actions/compose-notification
        id: compose
        with:
          template: hotfix-deploy
          deploy-result: ${{ needs.deploy-to-demo.result }}
          # Success only when smoke-check AND the backport PR both succeed -
          # otherwise the "backport PR open" message would be a false
          # positive if the backport failed.
          secondary-result: ${{ (needs.smoke-check.result == 'success' && needs.backport-to-main.result == 'success') && 'success' || 'failure' }}
          tag: ${{ needs.release-please.outputs.tag_name }}
      - uses: ./.github/actions/discord-notify-outcome
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: ${{ steps.compose.outputs.title }}
          status: ${{ steps.compose.outputs.status }}
          message: ${{ steps.compose.outputs.message }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
