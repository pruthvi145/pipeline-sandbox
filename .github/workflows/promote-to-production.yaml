name: "Release: Promote to Production"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to promote (e.g., v1.0.0). Must be an existing pre-release."
        required: true
        type: string
      redeploy:
        description: "Re-deploy a tag that is already stable (e.g. to pick up new env vars). Skips the pre-release check."
        required: false
        default: false
        type: boolean
      force_downgrade:
        description: "Allow promoting a tag older than what's currently live in production. Only use if you really mean to roll back."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.find.outputs.release_id }}
      already_stable: ${{ steps.find.outputs.already_stable }}
      is_newer_than_latest: ${{ steps.find.outputs.is_newer_than_latest }}
      current_latest_tag: ${{ steps.find.outputs.current_latest_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag format and release state
        id: find
        uses: actions/github-script@v9
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REDEPLOY: ${{ inputs.redeploy }}
          INPUT_FORCE_DOWNGRADE: ${{ inputs.force_downgrade }}
        with:
          script: |
            const { validateTagName } = require('./scripts/ci/check-release-downgrade.js');

            const tag = process.env.INPUT_TAG;
            const redeploy = process.env.INPUT_REDEPLOY === 'true';
            const forceDowngrade = process.env.INPUT_FORCE_DOWNGRADE === 'true';

            if (!validateTagName(tag)) {
              core.setFailed(`Tag "${tag}" does not match strict v-prefixed semver (e.g. v1.0.0). Refusing to promote.`);
              return;
            }

            let release;
            try {
              const res = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              release = res.data;
            } catch (err) {
              if (err && err.status === 404) {
                core.setFailed(`No GitHub Release found for tag "${tag}".`);
                return;
              }
              throw err;
            }

            if (release.draft) {
              core.setFailed(`Release "${tag}" is still a draft. Publish it before promoting.`);
              return;
            }

            if (!release.prerelease && !redeploy) {
              core.setFailed(`${tag} is already a stable release - nothing to promote. Re-run with "redeploy" enabled to deploy it again.`);
              return;
            }

            core.setOutput('release_id', release.id);
            core.setOutput('already_stable', String(!release.prerelease));

            if (release.prerelease) {
              core.info(`Validated: ${tag} is a pre-release (id ${release.id}) - promoting to stable`);
            } else {
              core.warning(`${tag} is already stable - re-deploying it to production without changing release state.`);
            }

            // Guard against silently deploying an older version over a
            // newer one that's already live - see scripts/ci/check-release-downgrade.js.
            const { evaluatePromotion } = require('./scripts/ci/check-release-downgrade.js');

            let currentLatestTag = null;
            try {
              const { data: latest } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              currentLatestTag = latest.tag_name;
            } catch (err) {
              if (err.status !== 404) throw err;
            }

            const promotion = evaluatePromotion({ tag, currentLatestTag, forceDowngrade });
            if (!promotion.allowed) {
              core.setFailed(promotion.reason);
              return;
            }
            core.setOutput('is_newer_than_latest', String(promotion.isNewerThanLatest));
            core.setOutput('current_latest_tag', currentLatestTag || '');

  deploy-to-prod:
    needs: validate-release
    uses: ./.github/workflows/_deploy.yaml
    with:
      environment: production
      vercel-environment: production
      vercel-production: true
      vercel-project-id: ${{ vars.VERCEL_PROJECT }}
      run-migration: true
      take-snapshot: true
      vercel-alias: ${{ vars.PROD_ALIAS }}
      ref: ${{ inputs.tag }}
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_DB_BACKUP_BUCKET: ${{ secrets.R2_DB_BACKUP_BUCKET }}
      R2_DB_BACKUP_ACCESS_KEY_ID: ${{ secrets.R2_DB_BACKUP_ACCESS_KEY_ID }}
      R2_DB_BACKUP_SECRET_ACCESS_KEY: ${{ secrets.R2_DB_BACKUP_SECRET_ACCESS_KEY }}

  # Flip prerelease → false only after deploy succeeds, so a failed deploy
  # leaves the release as a prerelease (easy retry via re-dispatch).
  #
  # Sandbox simplification: the real app uses a GitHub App token here so the
  # release update is attributed to a bot identity. This repo has no GitHub
  # App set up, so it uses the workflow's own default GITHUB_TOKEN instead -
  # functionally identical for a personal repo, just attributed to you.
  mark-stable:
    runs-on: ubuntu-latest
    needs: [validate-release, deploy-to-prod]
    if: needs.deploy-to-prod.result == 'success' && needs.validate-release.outputs.already_stable != 'true'
    permissions:
      contents: write
    steps:
      - name: Mark release as stable
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.validate-release.outputs.release_id }}
          INPUT_TAG: ${{ inputs.tag }}
          IS_NEWER_THAN_LATEST: ${{ needs.validate-release.outputs.is_newer_than_latest }}
        with:
          script: |
            const isNewer = process.env.IS_NEWER_THAN_LATEST === 'true';
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID, 10),
              prerelease: false,
              // Only steal the "latest" label if this tag is actually newer -
              // otherwise an older-line hotfix promoted after a newer normal
              // release would incorrectly become "latest" on GitHub.
              make_latest: isNewer ? 'true' : 'false',
            });
            if (isNewer) {
              core.info(`${process.env.INPUT_TAG} is now the latest stable release`);
            } else {
              core.info(`${process.env.INPUT_TAG} promoted to stable, but is not newer than the current latest release - "latest" label left unchanged`);
            }

  # release/vX.Y.Z branches are created locally, on demand, by
  # `npm run hotfix:start` - no CI automation creates one (see
  # scripts/hotfix-start.js). This job only cleans up: once a newer tag is
  # promoted, the previous release branch (if a hotfix ever created one)
  # has done its job - it existed only so hotfix PRs had something to
  # target - and is safe to delete.
  delete-superseded-release-branch:
    needs: [validate-release, deploy-to-prod]
    if: needs.deploy-to-prod.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Delete the superseded release branch, if any
        uses: actions/github-script@v9
        env:
          INPUT_TAG: ${{ inputs.tag }}
          CURRENT_LATEST_TAG: ${{ needs.validate-release.outputs.current_latest_tag }}
          IS_NEWER_THAN_LATEST: ${{ needs.validate-release.outputs.is_newer_than_latest }}
        with:
          script: |
            const { branchToDelete } = require('./scripts/ci/cleanup-superseded-release-branch.js');

            const branch = branchToDelete({
              tag: process.env.INPUT_TAG,
              currentLatestTag: process.env.CURRENT_LATEST_TAG || null,
              isNewerThanLatest: process.env.IS_NEWER_THAN_LATEST === 'true',
            });

            if (!branch) {
              core.info('No superseded release branch to delete');
              return;
            }

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
              core.info(`Deleted superseded branch ${branch}`);
            } catch (err) {
              if (err.status !== 422 && err.status !== 404) throw err;
              core.info(`${branch} was already gone - nothing to delete`);
            }

  notify:
    runs-on: ubuntu-latest
    needs: [validate-release, deploy-to-prod, mark-stable]
    if: |
      always() && (needs.deploy-to-prod.result == 'success' || needs.deploy-to-prod.result == 'failure')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/compose-notification
        id: compose
        with:
          template: prod-promote
          deploy-result: ${{ needs.deploy-to-prod.result }}
          secondary-result: ${{ needs.mark-stable.result }}
          tag: ${{ inputs.tag }}
          redeploy: ${{ needs.validate-release.outputs.already_stable }}
      - uses: ./.github/actions/discord-notify-outcome
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: ${{ steps.compose.outputs.title }}
          status: ${{ steps.compose.outputs.status }}
          message: ${{ steps.compose.outputs.message }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
