name: Migrate Supabase Database
description: Run Supabase migrations against any environment (dev/test/prod)

inputs:
  project-id:
    description: "Supabase project reference ID"
    required: true
  access-token:
    description: "Supabase access token"
    required: true
  db-password:
    description: "Supabase database password"
    required: true
  baseline-cidrs:
    description: "Space-separated CIDRs the allow-list is restored to after migrating"
    required: true

# No setup-cli step: callers run `npm ci` first, so `npx supabase` resolves the
# devDependency in package.json. A separately pinned binary was silently ignored
# by npx, meaning the pin never described the version that actually ran.
runs:
  using: "composite"
  steps:
    # Opens before `link`, not just before `db push`, because `link` also opens
    # a Postgres connection. Supabase reads an empty allow-list as "restrictions
    # off", so an unset baseline would silently disable the control instead of
    # failing - hence the guard.
    - name: Open migration window
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        BASELINE_CIDRS: ${{ inputs.baseline-cidrs }}
        PROJECT_ID: ${{ inputs.project-id }}
      run: |
        set -euo pipefail
        if [ -z "${BASELINE_CIDRS// /}" ]; then
          echo "::error::baseline-cidrs is empty - refusing to run, this would disable network restrictions"
          exit 1
        fi
        RUNNER_IP="$(curl -fsS --retry 3 --max-time 10 https://api.ipify.org)"
        FLAGS=()
        for cidr in $BASELINE_CIDRS; do FLAGS+=(--db-allow-cidr "$cidr"); done
        echo "🔓 Adding runner to the allow-list for ${PROJECT_ID}..."
        npx supabase network-restrictions update --project-ref "$PROJECT_ID" \
          "${FLAGS[@]}" --db-allow-cidr "${RUNNER_IP}/32" --experimental

        # Read status from the Management API rather than the CLI's printed text:
        # `get` ignores --output json, so matching its wording would break silently
        # on a CLI upgrade, and the version floats with package.json.
        for _ in $(seq 1 20); do
          STATUS="$(curl -sS --max-time 10 \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_ID}/network-restrictions" \
            | jq -r '.status // empty')"
          if [ "$STATUS" = "applied" ]; then
            echo "✅ Window open"
            exit 0
          fi
          sleep 5
        done
        echo "::error::Network restrictions did not reach applied state in 100s (last status: ${STATUS:-unknown})"
        echo "::error::If the next step fails with EADDRNOTALLOWED, the address Supabase sees differs from ${RUNNER_IP} reported by api.ipify.org. The error names the address it saw - allow that instead."
        exit 1

    - name: Link to Supabase project
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        SUPABASE_DB_PASSWORD: ${{ inputs.db-password }}
        BASELINE_CIDRS: ${{ inputs.baseline-cidrs }}
        PROJECT_ID: ${{ inputs.project-id }}
      run: |
        echo "🔗 Linking to Supabase project ${PROJECT_ID}..."
        npx supabase link --project-ref "$PROJECT_ID"

    - name: Run database migrations
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        SUPABASE_DB_PASSWORD: ${{ inputs.db-password }}
        BASELINE_CIDRS: ${{ inputs.baseline-cidrs }}
        PROJECT_ID: ${{ inputs.project-id }}
      run: |
        set -uo pipefail
        echo "🚀 Running database migrations..."
        if OUT="$(npx supabase db push 2>&1)"; then
          echo "$OUT"
          echo "✅ Database migrations completed successfully"
          exit 0
        fi
        echo "$OUT"

        # The window was opened for whatever api.ipify.org reported, but the
        # database admits on the address it actually sees, and those can differ
        # behind a proxy or NAT. The refusal names the address Supabase saw, so
        # reopen for that one and retry rather than failing the deploy.
        #
        # This guard lives here, not on `link`: as of CLI 2.113.0 `link` only
        # writes the project ref and never opens a Postgres connection, so a
        # blocked address first surfaces on push.
        SEEN="$(sed -n 's/.*allow_list: {\([0-9, ]*\)}.*/\1/p' <<<"$OUT" | head -1 | tr -d ' ' | tr ',' '.')"
        if [ -z "$SEEN" ]; then
          exit 1
        fi

        echo "::warning::Supabase saw this runner as ${SEEN}, which is not what api.ipify.org reported. Reopening the window for ${SEEN}."
        FLAGS=()
        for cidr in $BASELINE_CIDRS; do FLAGS+=(--db-allow-cidr "$cidr"); done
        npx supabase network-restrictions update --project-ref "$PROJECT_ID" \
          "${FLAGS[@]}" --db-allow-cidr "${SEEN}/32" --experimental

        for _ in $(seq 1 20); do
          STATUS="$(curl -sS --max-time 10 \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_ID}/network-restrictions" \
            | jq -r '.status // empty')"
          [ "$STATUS" = "applied" ] && break
          sleep 5
        done

        npx supabase db push
        echo "✅ Database migrations completed successfully"

    # always(): a window left open would allow a recycled GitHub runner address
    # until the next deploy or the drift check.
    - name: Close migration window
      if: always()
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        BASELINE_CIDRS: ${{ inputs.baseline-cidrs }}
        PROJECT_ID: ${{ inputs.project-id }}
      run: |
        set -euo pipefail
        if [ -z "${BASELINE_CIDRS// /}" ]; then
          echo "::error::baseline-cidrs is empty - cannot restore allow-list"
          exit 1
        fi
        FLAGS=()
        for cidr in $BASELINE_CIDRS; do FLAGS+=(--db-allow-cidr "$cidr"); done
        echo "🔒 Restoring allow-list to: ${BASELINE_CIDRS}"
        npx supabase network-restrictions update --project-ref "$PROJECT_ID" \
          "${FLAGS[@]}" --experimental
