name: Open Supabase DB Network Window
description: Add this runner's IP to a Supabase project's network allow-list and wait until it's applied

inputs:
  project-id:
    description: "Supabase project reference ID"
    required: true
  access-token:
    description: "Supabase access token"
    required: true
  baseline-cidrs:
    description: "Space-separated CIDRs the allow-list is restored to when the window closes"
    required: true

# Split out of migrate-supabase so restore-database (rollback.yaml) can open the
# same allow-list window for a direct psql connection without duplicating this
# dance a third time. Behavior is unchanged from migrate-supabase's original
# inline step.
runs:
  using: "composite"
  steps:
    - name: Open migration window
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        BASELINE_CIDRS: ${{ inputs.baseline-cidrs }}
        PROJECT_ID: ${{ inputs.project-id }}
      run: |
        set -euo pipefail
        if [ -z "${BASELINE_CIDRS// /}" ]; then
          echo "::error::baseline-cidrs is empty - refusing to run, this would disable network restrictions"
          exit 1
        fi
        RUNNER_IP="$(curl -fsS --retry 3 --max-time 10 https://api.ipify.org)"
        FLAGS=()
        for cidr in $BASELINE_CIDRS; do FLAGS+=(--db-allow-cidr "$cidr"); done
        echo "🔓 Adding runner to the allow-list for ${PROJECT_ID}..."
        npx supabase network-restrictions update --project-ref "$PROJECT_ID" \
          "${FLAGS[@]}" --db-allow-cidr "${RUNNER_IP}/32" --experimental

        # Read status from the Management API rather than the CLI's printed text:
        # `get` ignores --output json, so matching its wording would break silently
        # on a CLI upgrade, and the version floats with package.json.
        for _ in $(seq 1 20); do
          STATUS="$(curl -sS --max-time 10 \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_ID}/network-restrictions" \
            | jq -r '.status // empty')"
          if [ "$STATUS" = "applied" ]; then
            echo "✅ Window open"
            exit 0
          fi
          sleep 5
        done
        echo "::error::Network restrictions did not reach applied state in 100s (last status: ${STATUS:-unknown})"
        echo "::error::If the next step fails with EADDRNOTALLOWED, the address Supabase sees differs from ${RUNNER_IP} reported by api.ipify.org. The error names the address it saw - allow that instead."
        exit 1
