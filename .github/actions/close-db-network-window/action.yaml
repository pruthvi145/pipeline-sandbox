name: Close Supabase DB Network Window
description: Restore a Supabase project's network allow-list to its baseline CIDRs

inputs:
  project-id:
    description: "Supabase project reference ID"
    required: true
  access-token:
    description: "Supabase access token"
    required: true
  baseline-cidrs:
    description: "Space-separated CIDRs the allow-list is restored to"
    required: true

# Split out of migrate-supabase so restore-database (rollback.yaml) can close the
# same allow-list window it opened via open-db-network-window, without
# duplicating this dance a third time. Behavior is unchanged from
# migrate-supabase's original inline step. Callers must run this with
# `if: always()` - a window left open would allow a recycled GitHub runner
# address until the next deploy or the drift check.
runs:
  using: "composite"
  steps:
    - name: Close migration window
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access-token }}
        BASELINE_CIDRS: ${{ inputs.baseline-cidrs }}
        PROJECT_ID: ${{ inputs.project-id }}
      run: |
        set -euo pipefail
        if [ -z "${BASELINE_CIDRS// /}" ]; then
          echo "::error::baseline-cidrs is empty - cannot restore allow-list"
          exit 1
        fi
        FLAGS=()
        for cidr in $BASELINE_CIDRS; do FLAGS+=(--db-allow-cidr "$cidr"); done
        echo "🔒 Restoring allow-list to: ${BASELINE_CIDRS}"
        npx supabase network-restrictions update --project-ref "$PROJECT_ID" \
          "${FLAGS[@]}" --experimental
